services:
  toms-api:
    container_name: toms-api
    image: "bes/toms-api:p2"
    restart: unless-stopped
    ports:
      - "31001:80"
    networks:
      - toms
    environment:
      TZ: "Asia/Hong_Kong"
      ASPNETCORE_URLS: "http://+:80;"
      ASPNETCORE_ENVIRONMENT: "p2"
      DOTNET_ENVIRONMENT: "p2"
    volumes:
      - "/mnt/data/toms/toms-ca-chain.pem:/etc/ssl/certs/ca.crt"
      - "/mnt/data/toms/toms-api.appsettings.p2.json:/app/appsettings.p2.json"
  auth-api:
    container_name: auth-api
    image: "bes/auth-api:p2"
    restart: unless-stopped
    ports:
      - "31004:80"
    networks:
      - toms
    environment:
      TZ: "Asia/Hong_Kong"
      ASPNETCORE_URLS: "http://+:80;"
      ASPNETCORE_ENVIRONMENT: "p2"
      DOTNET_ENVIRONMENT: "p2"
    volumes:
      - "/mnt/data/toms/toms-ca-chain.pem:/etc/ssl/certs/ca.crt"
      - "/mnt/data/toms/auth-api.appsettings.p2.json:/app/appsettings.p2.json"

networks:
  toms: {}
