nameOverride: toms-portal
fullnameOverride: toms-portal

image:
  repository: 192.168.64.186/bes/toms-portal
  tag: master
  pullPolicy: Always
imagePullSecrets: []

http:
  enabled: true
  port: 80
https:
  enabled: true
  port: 443

service:
  enabled: true
  type: NodePort
  httpNodePort: 31002
  httpsNodePort: 32002

caChainSecretName: ca-chain-secret
serverCertSecretName: app00015-server-tls
# clientCertSecretName: app00015-client-tls

config:
  dotnetEnv: "K8S_DEV"
  appsettings: |
    {
      "redis": {
        "connectionString": "192.168.64.109:6379, password=uBg+4CD3Q08nQaXSpvdsq2gWH+LDXtreyQxe9hBO3hcUjcawTvmgt5AgWoAXnZQXdwz6FAyAcdwiy7MA"
      },
      "Kestrel": {
        "Certificates": {
          "Default": {
            "Path": "/app/server-cert-volume/tls.crt",
            "KeyPath": "/app/server-cert-volume/tls.key"
          }
        }
      },
      "ClientCertConfig": {
        "Path": "/app/client-cert-volume/tls.crt",
        "KeyPath": "/app/client-cert-volume/tls.key"
      },
      "CertAuthCacheEnabled": false
    }

ingress:
  enabled: true
  ingressClassName: kong
  path: /
  hosts:
    - toms-portal.ffts.com.hk
  tls:
    - secretName: app00015-server-tls
      hosts:
        - toms-portal.ffts.com.hk
  servicePortName: https

kongingress:
  enabled: true
  proxy:
    protocol: https

replicaCount: 3

containerTimeZone: Asia/Hong_Kong

probes:
  enabled: false
  # Optionally specify a set of secret objects whose values
  # will be injected as environment variables by default.
  # You should add this section to a file like secrets.yaml
  # that is explicitly NOT committed to source code control
  # and then include it as part of your helm install step.
  # ref: https://kubernetes.io/docs/concepts/configuration/secret/
  #
  # This creates a secret "mysecret" and injects "mypassword"
  # as the environment variable mysecret_mypassword=password.
  # mysecret:
  #   mypassword: password

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
