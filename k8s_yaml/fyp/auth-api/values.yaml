nameOverride: auth-api
fullnameOverride: auth-api

image:
  registry: "us-central1-docker.pkg.dev/direct-topic-422109/direct-topic-422109"
  repository: auth-api
  tag: master
  pullPolicy: Always
imagePullSecrets: []

http:
  enabled: true
  port: 80
https:
  enabled: true
  port: 443

service:
  enabled: true
  type: NodePort
  # node port 30000-32767
  httpNodePort: 32100
  httpsNodePort: 32144

caChainSecretName: ca-chain-secret
serverCertSecretName: common-server-tls
# clientCertSecretName: auth-api-client-tls

clusterRole:
  enabled: true
  serviceAccountName: auth-api

config:
  dotnetEnv: "K8S_DEV"
  appsettings: |
    {
    }

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 256k
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-max-temp-file-size: 2048m
   # nginx.ingress.kubernetes.io/x-forwarded-prefix: "authapi"
  path: /authapi
  hosts:
    - myfitnessgym.me
  tls:
    - secretName: auth-api-server-tls
      hosts:
        - myfitnessgym.me
  servicePortName: http
replicaCount: 1

containerTimeZone: Asia/Hong_Kong

probes:
  enabled: false
  # Optionally specify a set of secret objects whose values
  # will be injected as environment variables by default.
  # You should add this section to a file like secrets.yaml
  # that is explicitly NOT committed to source code control
  # and then include it as part of your helm install step.
  # ref: https://kubernetes.io/docs/concepts/configuration/secret/
  #
  # This creates a secret "mysecret" and injects "mypassword"
  # as the environment variable mysecret_mypassword=password.
  # mysecret:
  #   mypassword: password

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
