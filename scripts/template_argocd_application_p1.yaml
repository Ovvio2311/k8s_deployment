apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{app_name}}"
  namespace: argocd
spec:
  destination:
    namespace: "{{namespace}}"
    server: https://kubernetes.default.svc
  project: "default"
  source:
    path: "{{zone_path}}/{{app_folder_name}}"    
    repoURL: "http://172.16.148.130/root/mirrored_k8s_deployment.git"
    targetRevision: master
    helm:
      valueFiles:
        - values-p1-common.yaml
        - values-p1-image-tag.yaml
        - values-p1-app-settings.yaml
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

