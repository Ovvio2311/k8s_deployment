apiVersion: v1
kind: Service
metadata:
  namespace: demo-argocd
  name: simple-nginx
spec:
  selector:
    app: nginx
  ports:
    - name: http
      protocol: TCP
      port: 10201
      targetPort: 80
    - name: https
      protocol: TCP
      port: 10200
      targetPort: 443
  externalIPs:
    - 192.168.64.170