version: '3'

services:
  prometheus:
    image: prom/prometheus:v2.43.1
    volumes:
      - /home/autotoll/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /home/autotoll/prometheus/prometheus.kubeconfig:/etc/prometheus/prometheus.kubeconfig
      - /home/autotoll/prometheus/prometheus-data:/prometheus      
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:9.5.1
    volumes:
      - /home/autotoll/prometheus/grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
