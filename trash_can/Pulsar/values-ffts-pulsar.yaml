## TLS
## templates/tls-certs.yaml
##
## The chart is using cert-manager for provisioning TLS certs for
## brokers and proxies.
tls:
  enabled: false

zookeeper:
  replicaCount: 3
  volumes: 
    data:
      storageClassName: local-path

bookkeeper:
  replicaCount: 4
  volumes: 
    journal:
      storageClassName: local-path
    ledgers:
      storageClassName: local-path
  configData:
    nettyMaxFrameSizeBytes: '31457280'
    PULSAR_MEM: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=512m"
  resources:
    requests:
      memory: "1024Mi"
      cpu: "500m"
    limits:
      memory: "1024Mi"
      cpu: "500m"

broker:
  replicaCount: 3
  configData:
    autoSkipNonRecoverableData: "true"
    managedLedgerDefaultEnsembleSize: "2"
    managedLedgerDefaultWriteQuorum: "2"
    managedLedgerDefaultAckQuorum: "2"
    maxMessageSize: '31457280'
    PULSAR_MEM: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=512m"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "512Mi"
      cpu: "500m"

proxy:
  replicaCount: 3
  ingress:
    enabled: false

prometheus:
  component: prometheus
